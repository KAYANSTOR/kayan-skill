name: Validate skill catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate metadata and paths
        run: python scripts/validate_catalog.py --root .

      - name: Check registry and tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check shell and Python syntax only
        run: |
          python -m compileall -q scripts tests
          git diff --check
