name: Validate skill catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate metadata and paths
        run: python scripts/validate_catalog.py --root .

      - name: Check registry and tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check shell and Python syntax only
        run: |
          python -m compileall -q scripts tests
          git diff --check

      - name: Build complete skill catalog snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path(".")
          output = Path("kayan-skill-snapshot.zip")
          excluded = {".git", ".github/workflows"}
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file() or output == path:
                      continue
                  relative = path.relative_to(root)
                  if any(part in excluded for part in relative.parts):
                      continue
                  if "__pycache__" in relative.parts or path.suffix == ".pyc":
                      continue
                  archive.write(path, relative.as_posix())
          PY

      - name: Upload complete skill catalog snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kayan-skill-snapshot-${{ github.sha }}
          path: kayan-skill-snapshot.zip
          if-no-files-found: error
          retention-days: 90
